[package]
name = "aprender-code-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Hermetic, receipted evaluation harness for `apr code` (APR-CODE-EVAL-001)"
keywords = ["eval", "swe-bench", "pass-at-k", "aprender"]
categories = ["development-tools"]
# Published: `apr-cli` is published and its `apr code eval` verb depends on this crate, so
# it must be on crates.io and enters the cascade before apr-cli (scripts/cascade-publish.sh
# TIERS[2]; decided on #5286).

# Library only (FALSIFY-MONO-011 allows binaries on the listed crates only). The driver
# that runs it is an `apr` subcommand (#5286).
[lib]
name = "aprender_code_eval"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
