metadata:
  version: "1.1.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  references:
    - "GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers (Frantar et al., 2023)"
    - "QuIP#: Even Better LLM Quantization with Hadamard Incoherence (Chee et al., 2023)"
  description: |
    AVX-512 Q4_K quantized GEMV kernel contract. Processes 16 f32 elements
    per iteration using zmm registers (2x throughput vs AVX2 8-wide).

name: avx512-q4k
version: "1.1.0"
scope: "crates/aprender-compute/src/backends/q4k/gemv/avx512.rs"

description: |
  Fused dequantize + matrix-vector multiply for Q4_K quantized weights
  using AVX-512 SIMD (512-bit zmm registers, 16-wide f32).

  Q4_K super-block layout: 256 elements per block, 144 bytes.
  Each block: d(f16) + dmin(f16) + scales[12] + qs[128].
  4-bit values dequantized to f32 and accumulated via FMA.

equations:
  C-AVX512-Q4K-001:
    description: "Output matches scalar reference within tolerance"
    formula: "∀ i: |avx512_output[i] - scalar_output[i]| < ε where ε = 1e-3"
    note: "Tolerance accounts for FMA instruction reordering vs serial accumulation"

  C-AVX512-Q4K-002:
    description: "Performance: AVX-512 achieves ≥1.5x throughput vs AVX2"
    formula: "throughput(avx512) ≥ 1.5 × throughput(avx2) for in_dim ≥ 1024"
    note: "16-wide vs 8-wide; overhead from zmm register management limits to ~1.5x (not 2x)"

  C-AVX512-Q4K-003:
    description: "Super-block processing is complete (no elements skipped) AND every activation load stays within [0, in_dim) — no heap over-read"
    formula: "∀ row: Σ elements_processed = in_dim ∧ ∀ SIMD load at base b reading w lanes: b + w ≤ in_dim"
    note: |
      A 64-element chunk maps low nibbles → activation [base,base+32) and high
      nibbles → [base+32,base+64) — DIFFERENT positions, so the high-nibble loads
      need their OWN bound. Full chunks (base+64 ≤ in_dim) use unguarded loads;
      the partial tail uses masked loads (_mm512_maskz_loadu_ps) that read only
      the in-bounds lanes and zero the rest. Pre-1.1.0 the high-nibble loads
      shared the low-nibble guard (base+32 ≤ in_dim), over-reading up to 128 bytes
      AND dropping the valid tail for in_dim ≡ 32/96/160/224 (mod 256).

falsification:
  - id: FALSIFY-AVX512-Q4K-001
    description: "AVX-512 output matches scalar for random inputs"
    test: "backend equivalence tests in aprender-compute"
    evidence: "cargo test -p aprender-compute --lib avx512"

  - id: FALSIFY-AVX512-Q4K-002
    description: "Performance threshold verified by benchmark"
    test: "Q4K GEMV benchmark"
    evidence: "cargo bench -p aprender-compute -- q4k"

  - id: FALSIFY-AVX512-Q4K-003
    description: "Non-256-aligned in_dim: the AVX-512 GEMV reads only [0,in_dim) (no heap over-read) and matches the scalar reference exactly (no skipped/garbage high-nibble tail). Discharges the previously-unwired C-AVX512-Q4K-003."
    test: "falsify_avx512_q4k_003_non_aligned_in_dim_no_oob — activation buffer carries a non-zero sentinel tail past in_dim inside the allocation; pre-fix over-read injects the sentinel (RED, e.g. in_dim=32 → SIMD 7.4e9 vs scalar 532), masked-load fix matches scalar (GREEN). Covers in_dim ∈ {32,48,96,160,224} (mod-256 mid-chunk cases) + 256 control."
    evidence: "cargo test -p aprender-compute --lib falsify_avx512_q4k_003"

falsification_tests:
  - id: FALSIFY-AVX512-Q4K-003-T
    rule: "The SIMD Q4K GEMV reads only [0, in_dim) and keeps the high-nibble tail for non-256-aligned in_dim"
    prediction: "For in_dim in {32, 48, 96, 160, 224, 256} with a 1e6 sentinel past in_dim inside the activation allocation, matmul_q4k_f32_dispatch matches matmul_q4k_f32_scalar on every row within 1e-2. Narrower than the condition: the tolerance is 1e-2, not exact, the test is x86_64-only, and on a host without AVX-512 the dispatch takes the AVX2 or scalar path, so there it checks parity but not the AVX-512 kernel"
    test: "cargo test -p aprender-compute --lib falsify_avx512_q4k_003_non_aligned_in_dim_no_oob"
    if_fails: "The AVX-512 kernel over-reads past in_dim (the sentinel leaks into the dot product) or drops the valid high-nibble tail"
