metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 10: Training with aprender-train
  contract: apr-book-ch10
  status: enforced
  title: "Training with aprender-train"
  part: III
  example: ch10_training
  arxiv_citations: ["2106.09685", "2305.14314", "1711.05101", "1608.03983", "1710.03740", "1502.05767"]

api_calls:
  - module: "aprender::autograd"
    functions: ["ComputationGraph::new", "ComputationGraph::record", "ComputationGraph::backward"]
    min_calls: 3
  - module: "aprender::optim"
    functions: ["Adam::new"]
    min_calls: 1
preconditions:
  - "cargo build -p aprender-core --example ch10_training succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "ComputationGraph records forward ops"
  - "Backward pass computes gradients"
  - "Adam optimizer instantiated with learning rate"
falsification:
  - condition: "cargo run -p aprender-core --example ch10_training exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "ComputationGraph not used for forward/backward pass"
    severity: P0
    action: add_autograd
  - condition: "No gradient computed or validated"
    severity: P0
    action: add_gradient_check
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH10-001
    rule: "The chapter example runs to completion and every assert! in it holds"
    prediction: "cargo run -p aprender-core --example ch10_training exits 0; any failing assert! panics and the run exits non-zero"
    test: "cargo run -p aprender-core --example ch10_training"
    if_fails: "The chapter's code no longer runs as printed, or one of the results it asserts is wrong"
  - id: FALSIFY-BOOK-CH10-002
    rule: "The chapter example imports no pre-monorepo crate name"
    prediction: "namespace_discipline_in_examples passes: ch10_training.rs has no 'use <legacy>::', '<legacy> =' or 'cargo install <legacy>' for trueno, realizar, entrenar, batuta, presentar or renacer. It scans the example source, not the chapter prose"
    test: "cargo test -p aprender-core --test book_contracts namespace_discipline_in_examples"
    if_fails: "The chapter example teaches a crate name that no longer exists as a published dependency"
