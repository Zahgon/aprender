metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 17: Bayesian Methods
  contract: apr-book-ch17
  status: enforced
  title: "Bayesian Methods"
  part: V
  example: ch17_bayesian
  arxiv_citations: ["math/0504499"]

api_calls:
  - module: "aprender::bayesian"
    functions: ["BetaBinomial::new", "NormalInverseGamma::new", "NormalInverseGamma::update", "NormalInverseGamma::posterior_mean_mu"]
    min_calls: 4
preconditions:
  - "cargo build -p aprender-core --example ch17_bayesian succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "NormalInverseGamma prior is constructed and updated with data"
  - "Posterior mean shifts toward data mean after update"
  - "Posterior precision increases after observing data"
falsification:
  - condition: "cargo run -p aprender-core --example ch17_bayesian exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "NormalInverseGamma::update not called with real data"
    severity: P0
    action: rewrite
  - condition: "Posterior values not compared to prior (no learning demonstrated)"
    severity: P0
    action: add_posterior_comparison
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH17-001
    rule: "The chapter example runs to completion and every assert! in it holds"
    prediction: "cargo run -p aprender-core --example ch17_bayesian exits 0; any failing assert! panics and the run exits non-zero"
    test: "cargo run -p aprender-core --example ch17_bayesian"
    if_fails: "The chapter's code no longer runs as printed, or one of the results it asserts is wrong"
  - id: FALSIFY-BOOK-CH17-002
    rule: "The chapter example imports no pre-monorepo crate name"
    prediction: "namespace_discipline_in_examples passes: ch17_bayesian.rs has no 'use <legacy>::', '<legacy> =' or 'cargo install <legacy>' for trueno, realizar, entrenar, batuta, presentar or renacer. It scans the example source, not the chapter prose"
    test: "cargo test -p aprender-core --test book_contracts namespace_discipline_in_examples"
    if_fails: "The chapter example teaches a crate name that no longer exists as a published dependency"
