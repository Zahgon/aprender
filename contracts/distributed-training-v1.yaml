metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  description: "Distributed training correctness"
  references:
    - "Provable contract for distributed-training-v1"

name: distributed-training
version: "1.0.0"
scope: "crates/aprender-distribute/src/"

description: |
  Data-parallel training: all-reduce gradients, synchronized parameters, deterministic with seed.

equations:
  gradient_sync:
    description: "∀ rank: params_after_step identical across workers"
    formula: "∀ rank: params_after_step identical across workers"

  loss_equivalence:
    description: "loss(distributed, N) ≈ loss(single, N) within ε"
    formula: "loss(distributed, N) ≈ loss(single, N) within ε"

falsification_tests:
  - id: FALSIFY-DISTRIBUTED_TRAINING_V1_001
    description: "∀ rank: params_after_step identical across workers"
    test: "cargo test -p aprender-train --lib falsify_dp_001_weight_sync_all_layers_and_classifier"
    prediction: "after replica 1's LoRA A/B and classifier weights are perturbed, sync_lora_weights_from_primary makes every one of them bit-identical to replica 0's"
    if_fails: "a worker keeps parameters that differ from the primary after a sync step"

  - id: FALSIFY-DISTRIBUTED_TRAINING_V1_002
    description: "loss(distributed, N) ≈ loss(single, N) within ε"
    test: "cargo test -p aprender-train --lib falsify_dp_005_single_vs_multi_gpu_loss_convergence"
    prediction: "the forward loss averaged over 20 samples sharded across 2 replicas is within 25% (relative) of the single-pipeline loss on the same samples"
    if_fails: "sharding the batch across replicas changes the loss the trainer optimizes"
