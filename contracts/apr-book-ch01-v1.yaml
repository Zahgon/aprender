metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 1: Why Rust for Machine Learning
  contract: apr-book-ch01
  status: enforced
  title: "Why Rust for Machine Learning"
  part: I
  example: ch01_hello_apr
  arxiv_citations: ["1910.02054", "1903.00982", "2407.10671"]

preconditions:
  - "cargo build -p aprender-core --example ch01_hello_apr succeeds"
  - "All arXiv IDs in citation table are valid"
  - "Zero legacy names in chapter text"
postconditions:
  - "Example produces correct output"
  - "All assert!() in example pass"
falsification:
  - condition: "cargo run -p aprender-core --example ch01_hello_apr exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Section without arXiv citation"
    severity: P0
    action: reject_chapter
  - condition: "Legacy name appears in chapter text"
    severity: P0
    action: reject_chapter
  - condition: "Oracle --explain output contradicts chapter claim"
    severity: P0
    action: reject_chapter
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH01-001
    rule: "The chapter example runs to completion and every assert! in it holds"
    prediction: "cargo run -p aprender-core --example ch01_hello_apr exits 0; any failing assert! panics and the run exits non-zero"
    test: "cargo run -p aprender-core --example ch01_hello_apr"
    if_fails: "The chapter's code no longer runs as printed, or one of the results it asserts is wrong"
  - id: FALSIFY-BOOK-CH01-002
    rule: "The chapter example imports no pre-monorepo crate name"
    prediction: "namespace_discipline_in_examples passes: ch01_hello_apr.rs has no 'use <legacy>::', '<legacy> =' or 'cargo install <legacy>' for trueno, realizar, entrenar, batuta, presentar or renacer. It scans the example source, not the chapter prose"
    test: "cargo test -p aprender-core --test book_contracts namespace_discipline_in_examples"
    if_fails: "The chapter example teaches a crate name that no longer exists as a published dependency"
