metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 16: Time Series Analysis
  contract: apr-book-ch16
  status: enforced
  title: "Time Series Analysis"
  part: V
  example: ch16_timeseries
  arxiv_citations: []

api_calls:
  - module: "aprender::time_series"
    functions: ["ARIMA::new", "ARIMA::fit", "ARIMA::forecast", "ARIMA::ar_coefficients"]
    min_calls: 4
preconditions:
  - "cargo build -p aprender-core --example ch16_timeseries succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "ARIMA model is fitted on real data"
  - "Forecast produces n_periods values"
  - "AR coefficients are accessible after fit"
falsification:
  - condition: "cargo run -p aprender-core --example ch16_timeseries exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "ARIMA::fit not called with real time series data"
    severity: P0
    action: rewrite
  - condition: "ARIMA::forecast not called or result not validated"
    severity: P0
    action: add_forecast_validation
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH16-001
    rule: "The chapter example runs to completion and every assert! in it holds"
    prediction: "cargo run -p aprender-core --example ch16_timeseries exits 0; any failing assert! panics and the run exits non-zero"
    test: "cargo run -p aprender-core --example ch16_timeseries"
    if_fails: "The chapter's code no longer runs as printed, or one of the results it asserts is wrong"
  - id: FALSIFY-BOOK-CH16-002
    rule: "The chapter example imports no pre-monorepo crate name"
    prediction: "namespace_discipline_in_examples passes: ch16_timeseries.rs has no 'use <legacy>::', '<legacy> =' or 'cargo install <legacy>' for trueno, realizar, entrenar, batuta, presentar or renacer. It scans the example source, not the chapter prose"
    test: "cargo test -p aprender-core --test book_contracts namespace_discipline_in_examples"
    if_fails: "The chapter example teaches a crate name that no longer exists as a published dependency"
