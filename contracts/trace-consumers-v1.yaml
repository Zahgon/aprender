metadata:
  version: "1.0.0"
  created: "2026-10-14"
  author: PAIML Engineering
  registry: true
  references:
    - "aprender#5314"
  description: |
    trace-consumers-v1: who reads each trace, profile and metrics surface the
    built binaries expose. A surface with no consumer is output nobody acts on.
name: trace-consumers
version: "1.0.0"
scope: "crates/aprender-contracts/src/trace_consumers.rs, crates/aprender-contracts/examples/trace_consumers.rs, evidence/binary/snapshot.jsonl"
description: |
  TRACE-001 TR-08 (#5314). The surface list is never written by hand: `derive`
  reads it off the tracked built-binary snapshot (`evidence/binary/snapshot.jsonl`,
  written by `scripts/dogfood_surfaces.sh --snapshot`). Every command, HTTP route
  and MCP tool of every bin target is a trace surface when a whole token of its
  bin name or its own name is one of `bench, benchmark, cbtop, memtrace, metrics,
  monitor, otlp, profile, profiling, roofline, telemetry, trace, traces, tracing`.
  The `apr` pair (apr-cli and the root facade) is one surface per name. Flags are
  not in the snapshot, so a `--trace` flag is out of scope here.

  The `consumers:` block below registers each derived surface once. A consumer is
  a `ledger`, a `gate` or a `runbook`, named as `<file>#<job, target or heading>`.
  An entry is `active` only with the `first_green` run that proved its consumer
  green, `report-only` until then, or `deprecated` with an `X.Y.Z` `remove_by`.

  Measured at 1.0.0 on the snapshot as tracked: 69 surfaces, 4 with a consumer
  (5.8%). The other 65 carry no consumer and no deprecation, so the check is RED
  on them by design: each needs a consumer or a deprecation ruling. No entry has
  a recorded first green run, so none is `active`.

  The at-HEAD check (`cargo run -p aprender-contracts --example trace_consumers`)
  is LAB (C324): it runs at night, never on a PR, merge-queue or release path.
  The falsification tests below hold the checker itself and run with the lib.
equations:
  C-TCR-001:
    description: "The registry and the derived surfaces are the same set, each entry once."
    formula: "keys(registry) = derive(snapshot) ∧ ∀ s: |{e ∈ registry : key(e) = s}| ≤ 1 ∧ derive(snapshot) ≠ ∅"
  C-TCR-002:
    description: "Every entry names a consumer or is deprecated, and an active entry carries its first green run."
    formula: "∀ e: (status(e) ≠ deprecated ⟹ consumer(e) ≠ ⊥) ∧ (status(e) = active ⟹ first_green(e) ≠ ⊥)"
  C-TCR-003:
    description: "A deprecated surface is gone by its remove_by version."
    formula: "∀ e: status(e) = deprecated ⟹ semver(remove_by(e)) ≠ ⊥ ∧ version(workspace) < remove_by(e)"
proof_obligations:
  - id: PO-TCR-001
    kind: correctness
    statement: "check reports Unregistered for a derived surface with no entry, NotDerived for an entry the binaries no longer expose, Duplicate for a surface registered twice, and NothingDerived for an empty derivation; derive keeps whole tokens only."
    discharged_by: FALSIFY-TCR-001
  - id: PO-TCR-002
    kind: correctness
    statement: "check reports NoConsumer for a non-deprecated entry without a consumer and ActiveWithoutFirstGreen for an active entry without first_green."
    discharged_by: FALSIFY-TCR-002
  - id: PO-TCR-003
    kind: correctness
    statement: "check reports DeprecatedPastRemoveBy once the workspace version reaches remove_by, and BadRemoveBy for a missing or non-X.Y.Z remove_by."
    discharged_by: FALSIFY-TCR-003
falsification:
  - id: FALSIFY-TCR-001
    description: "A derived surface nobody registered, or an entry for a surface no binary exposes, passes check. Discharges C-TCR-001 and PO-TCR-001."
    test: "cargo test -p aprender-contracts --lib trace_consumers::tests::falsify_tcr_001"
  - id: FALSIFY-TCR-002
    description: "An active entry without first_green, or an entry with no consumer that is not deprecated, passes check. Discharges C-TCR-002 and PO-TCR-002."
    test: "cargo test -p aprender-contracts --lib trace_consumers::tests::falsify_tcr_002"
  - id: FALSIFY-TCR-003
    description: "A deprecated surface still exposed at or past remove_by, or deprecated without an X.Y.Z remove_by, passes check. Discharges C-TCR-003 and PO-TCR-003."
    test: "cargo test -p aprender-contracts --lib trace_consumers::tests::falsify_tcr_003"
