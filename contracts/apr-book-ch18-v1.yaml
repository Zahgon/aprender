metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 18: Graph Algorithms
  contract: apr-book-ch18
  status: enforced
  title: "Graph Algorithms"
  part: V
  example: ch18_graphs
  arxiv_citations: ["0803.0476", "1609.02907"]

api_calls:
  - module: "aprender::graph"
    functions: ["Graph::from_weighted_edges", "Graph::dijkstra", "Graph::label_propagation", "Graph::clustering_coefficient", "Graph::density"]
    min_calls: 5
preconditions:
  - "cargo build -p aprender-core --example ch18_graphs succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "Dijkstra finds optimal shortest path"
  - "Label propagation assigns community labels"
  - "Graph metrics (density, clustering coefficient) computed"
falsification:
  - condition: "cargo run -p aprender-core --example ch18_graphs exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "No community detection algorithm called"
    severity: P0
    action: add_community_detection
  - condition: "No graph metric computed (density/clustering/diameter)"
    severity: P0
    action: add_graph_metrics
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH18-001
    rule: "The chapter example runs to completion and every assert! in it holds"
    prediction: "cargo run -p aprender-core --example ch18_graphs exits 0; any failing assert! panics and the run exits non-zero"
    test: "cargo run -p aprender-core --example ch18_graphs"
    if_fails: "The chapter's code no longer runs as printed, or one of the results it asserts is wrong"
  - id: FALSIFY-BOOK-CH18-002
    rule: "The chapter example imports no pre-monorepo crate name"
    prediction: "namespace_discipline_in_examples passes: ch18_graphs.rs has no 'use <legacy>::', '<legacy> =' or 'cargo install <legacy>' for trueno, realizar, entrenar, batuta, presentar or renacer. It scans the example source, not the chapter prose"
    test: "cargo test -p aprender-core --test book_contracts namespace_discipline_in_examples"
    if_fails: "The chapter example teaches a crate name that no longer exists as a published dependency"
