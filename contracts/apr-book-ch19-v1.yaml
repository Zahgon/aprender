metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 19: Text Processing and Tokenization
  contract: apr-book-ch19
  status: enforced
  title: "Text Processing and Tokenization"
  part: V
  example: ch19_text
  arxiv_citations: ["1508.07909", "1808.06226"]

api_calls:
  - module: "aprender::text::similarity"
    functions: ["cosine_similarity", "jaccard_similarity", "edit_distance"]
    min_calls: 3
preconditions:
  - "cargo build -p aprender-core --example ch19_text succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "Cosine similarity computed between real vectors"
  - "Jaccard similarity computed between real token sets"
  - "Edit distance computed between real strings"
falsification:
  - condition: "cargo run -p aprender-core --example ch19_text exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "No similarity function called with real text data"
    severity: P0
    action: rewrite
  - condition: "Similarity results not validated (orthogonal=0, identical=1)"
    severity: P0
    action: add_similarity_assertions
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH19-001
    rule: "The chapter example runs to completion and every assert! in it holds"
    prediction: "cargo run -p aprender-core --example ch19_text exits 0; any failing assert! panics and the run exits non-zero"
    test: "cargo run -p aprender-core --example ch19_text"
    if_fails: "The chapter's code no longer runs as printed, or one of the results it asserts is wrong"
  - id: FALSIFY-BOOK-CH19-002
    rule: "The chapter example imports no pre-monorepo crate name"
    prediction: "namespace_discipline_in_examples passes: ch19_text.rs has no 'use <legacy>::', '<legacy> =' or 'cargo install <legacy>' for trueno, realizar, entrenar, batuta, presentar or renacer. It scans the example source, not the chapter prose"
    test: "cargo test -p aprender-core --test book_contracts namespace_discipline_in_examples"
    if_fails: "The chapter example teaches a crate name that no longer exists as a published dependency"
