metadata:
  kind: schema
  version: 1.0.0
  created: '2026-10-14'
  author: PAIML Engineering
  description: |
    The apr response contract for machine consumers (#3720, derived from #3716's consumer
    requirements: a consumer that locks a generated asset to what produced it needs to know
    how the run ended, and why). One schema for every machine-readable `apr run` output,
    not a copy per mode.

    Every JSON output carries `status` (ok | refused | failed) and, iff not ok, an
    error naming its kind. A generation that produced no answer is a failure, never
    success with "".
  references:
  - '#3720: apr response contract for consumers'
  - '#3716: consumer requirements'
  - '#3793: constrained decoding refusals (exit 15, refusal.kind)'
  - '#3775: apr code -p --output-format json (same status/kind names)'
equations:
  status_envelope:
    formula: |
      forall run r with a machine-readable output mode:
        stdout(r) is exactly one JSON document D (on --stream: the terminal "final" event)
        D.status in {"ok", "refused", "failed"}
        D.error is present  <=>  D.status != "ok"
        D.error = { kind: snake_case(variant(e)), message: display(e), exit_code: exit(r) }
        status(e) = refused  <=>  a capability, limit or policy said no
    domain: apr run --json / --stream
    codomain: the document a consumer parses
    invariants:
    - A run that ends before it has a result still writes one document (the envelope, the model, text null)
    - error.exit_code is exactly the process's exit status, never re-mapped
    - Existing fields stay; status and error are added beside them
    - A constraint refusal keeps exit 15; its kind is constraint_refused and which refusal it was stays in refusal.kind
    preconditions:
    - the output mode is --json or --stream (not --benchmark)
    postconditions:
    - a consumer can tell refused from failed from ok without reading stderr
    lean_theorem: Theorems.Status_Envelope
    notes: |
      Refused kinds: file_not_found, not_a_file, missing_companion_file, invalid_format,
      invalid_input, invalid_model_file, feature_disabled, http_not_found, not_implemented,
      parity_failed, backend_unavailable, constraint_refused. Failed kinds: io_error,
      validation_failed, aprender_error, model_load_failed, inference_failed, network_error,
      empty_completion.
  empty_completion:
    formula: |
      trim(text(r)) == ""
        ==>  status = "failed", error.kind = "empty_completion", apr run exits 8
    domain: an apr run generation that ran
    codomain: never exit 0 with an empty answer
    invariants:
    - The run's own fields (tokens, timings, backend) are still reported beside the error
    - A constraint refusal of the same run takes precedence (exit 15, constraint_refused)
    preconditions:
    - generation ran to completion
    postconditions:
    - '"no answer" is never read as success'
    lean_theorem: Theorems.Empty_Completion
    notes: The qwen3-8b golden gate defect (#3724) had this shape, an empty answer read as a model defect;
      in production it would have read as success.
  model_identity:
    formula: |
      forall run r of apr run with a machine-readable output mode:
        D.model_digest = sha256sum(file(r))  when the model is one local file, else null
        D.apr_version = the apr crate version; D.apr_git_sha = the commit apr was built from
    domain: apr run --json / --stream
    codomain: what produced the document
    invariants:
    - The digest is the value sha256sum prints for the loaded file, hex lowercase
    - A run that ends before it has a result still names the apr build
    - The digest is computed only for machine-readable output, beside inference, never on the text path
    preconditions:
    - the output mode is --json or --stream (not --benchmark)
    postconditions:
    - a consumer can lock a generated asset to the exact model file and apr build
    lean_theorem: Theorems.Model_Identity
  serve_model_identity:
    formula: |
      forall response h of apr serve given one local model file m:
        header(h, "x-apr-model-digest") = sha256sum(m)
        body(h).object in {"chat.completion", "text_completion"}
          ==>  body(h).model_digest = sha256sum(m), body(h).apr_version, body(h).apr_git_sha
    domain: every HTTP response of apr serve on realizar's router (streams carry the header, sent before the first event)
    codomain: what answered the request
    invariants:
    - A server given no identity (no single model file) sends no header and no body fields
    - Every other body passes through unchanged
    - The file is hashed once at startup
    preconditions:
    - apr serve was given one readable model file
    postconditions:
    - a client can lock a served answer to the exact model file and apr build
    lean_theorem: Theorems.Serve_Model_Identity
    notes: The apr-cli-owned routers (wgpu, the APR CPU and SafeTensors fallback servers) do not carry it yet.
  seed_determinism:
    formula: |
      forall run r of apr run with a machine-readable output mode:
        D.determinism.deterministic = (backend(r) = cpu)
        D.determinism.seed = seed(r)  when r sampled (temperature > 0 and top_k != 1), else null
        not D.determinism.deterministic  ==>  D.determinism.reason in {gpu_not_guaranteed, backend_unreported}
    domain: apr run --json / --stream
    codomain: whether a repeat of the run is promised byte-identical output
    invariants:
    - A promised run carries no reason; a run that is not promised always names why
    - The seed is echoed exactly when the run drew from the seeded RNG
    preconditions:
    - the same model file, prompt, seed and sampling parameters
    postconditions:
    - a consumer never meets two different answers to the same promised run without being told
    lean_theorem: Theorems.Seed_Determinism
    notes: Measured 2026-10-15 on lambda, two models (qwen2.5-coder-0.5b Q4_K_M, qwen2.5-0.5b IQ4_XS), 12
      run pairs at greedy and temperature 0.7/0.9 with a seed, up to 128 tokens; every pair was byte-identical
      on CPU and on the RTX 4090. The GPU is still not promised, because no device-independent proof of a
      fixed reduction order exists; gx10 and intel are not measured yet (apr serve is measured under serve_seed_determinism).
  serve_seed_determinism:
    formula: |
      forall completion body b of apr serve given one model file:
        b.determinism.deterministic = (compute_class = cpu)
        not b.determinism.deterministic  ==>  b.determinism.reason in {gpu_not_guaranteed, backend_unreported}
    domain: chat.completion / text_completion bodies of apr serve
    codomain: whether a repeat of the request is promised byte-identical output
    invariants:
    - The promise is read off the backend the router dispatches to (compute_class_from_residency)
    - The request's seed is the client's own input, so the body does not echo it
    preconditions:
    - the same model file, request body, seed and sampling parameters
    postconditions:
    - a client never meets two different answers to the same promised request without being told
    lean_theorem: Theorems.Serve_Seed_Determinism
    notes: Measured 2026-10-15 on lambda, qwen2.5-coder-0.5b Q4_K_M, 8 request pairs over /v1/chat/completions
      at greedy and temperature 0.8 with seed 42, up to 96 tokens; every pair was byte-identical on CPU and
      on the RTX 4090. On intel (x86_64 CPU, qwen2.5-1.5b Q4_K_M, 4 pairs) every pair was byte-identical too. A body with no backend resident (the legacy demo model) says backend_unreported.
proof_obligations:
- id: RESP-INV-001
  type: invariant
  property: every CLI error has one kind, one status, and its own exit code in the envelope
  formal: "∀ e ∈ CliError: envelope(e).error.kind = kind(e) ∧ envelope(e).error.exit_code = exit(e)"
  applies_to: status_envelope
- id: RESP-INV-002
  type: invariant
  property: a run with no result still writes exactly one document
  formal: "fails_before_result(r, e) ⇒ stdout(r) = [error_document(e)]"
  applies_to: status_envelope
- id: RESP-INV-003
  type: invariant
  property: an empty completion is a named failure
  formal: "(trim(text) = \"\" ∧ ¬constraint_refused(r) ⇒ kind = empty_completion) ∧ (kind = empty_completion ⇒ trim(text) = \"\")"
  applies_to: empty_completion
- id: RESP-INV-004
  type: invariant
  property: the document names the model file by its sha256 and the apr build
  formal: "(is_file(m) ⇒ model_digest(D) = sha256(m)) ∧ (¬is_file(m) ⇒ model_digest(D) = null)"
  applies_to: model_identity
- id: RESP-INV-005
  type: invariant
  property: every apr serve response names the served file's sha256; completion bodies name the build too
  formal: "∀ h ∈ responses(m): digest_header(h) = sha256(m) ∧ (completion(h) ⇒ model_digest(h) = sha256(m))"
  applies_to: serve_model_identity
- id: RESP-INV-006
  type: invariant
  property: a run says whether its repeat is promised byte-identical, and why not when it is not
  formal: "deterministic(D) = (backend = cpu) ∧ (¬deterministic(D) ⇒ reason(D) ≠ null) ∧ (sampled(r) ⇒ seed(D) = seed(r)) ∧ (¬sampled(r) ⇒ seed(D) = null)"
  applies_to: seed_determinism
- id: RESP-INV-007
  type: invariant
  property: a served completion says whether its repeat is promised byte-identical, and why not when it is not
  formal: "∀ b ∈ completions: (deterministic(b) ⇒ class = cpu) ∧ (class = cpu ⇒ deterministic(b)) ∧ (¬deterministic(b) ⇒ reason(b) ≠ null)"
  applies_to: serve_seed_determinism
enforcement:
  cli_error_envelope:
    description: Every CliError variant maps to a kind, a status and its exit code
    check: run_tests_response_contract::FALSIFY-RESP-001
    severity: ERROR
  one_document:
    description: A --json/--stream run writes one document on every exit
    check: run_tests_response_contract::FALSIFY-RESP-002
    severity: ERROR
  empty_completion_refused:
    description: An empty or whitespace answer fails by name with exit 8
    check: run_tests_response_contract::FALSIFY-RESP-003
    severity: ERROR
  model_identity_named:
    description: apr run --json names the model digest and the apr build
    check: run_tests_response_contract::FALSIFY-RESP-004
    severity: ERROR
  serve_model_identity_named:
    description: apr serve sends x-apr-model-digest on every response and the identity in completion bodies
    check: model_identity_3720::FALSIFY-RESP-005
    severity: ERROR
  seed_determinism_declared:
    description: apr run --json and the stream final event say whether a repeat is promised
    check: run_tests_response_contract::FALSIFY-RESP-006
    severity: ERROR
  serve_seed_determinism_declared:
    description: apr serve completion bodies say whether a repeat is promised
    check: model_identity_3720::FALSIFY-RESP-007
    severity: ERROR
falsification_tests:
- id: FALSIFY-RESP-001
  rule: Every CliError has the contract kind, status and exit code
  prediction: the case table over every variant matches kind(), status(), exit_code_value() and envelope()
  test: response_contract_every_cli_error_has_its_kind_status_and_exit_code
  file: crates/apr-cli/src/commands/run_tests_response_contract.rs
  if_fails: a consumer cannot tell refused from failed, or the envelope re-maps an exit code
- id: FALSIFY-RESP-002
  rule: One document on every exit
  prediction: ok carries status and no error; a run with no result writes the envelope with the model;
    a constraint refused before output keeps its refusal fields; the stream's final event carries it
  test: |
    response_contract_a_run_that_ended_ok_says_so_and_carries_no_error
    response_contract_a_run_that_never_produced_a_result_still_writes_one_document
    response_contract_a_constraint_refused_before_output_keeps_its_refusal_fields
    response_contract_the_stream_final_event_carries_the_envelope
  file: crates/apr-cli/src/commands/run_tests_response_contract.rs
  if_fails: a machine consumer reads nothing (or two documents) on a failure
- id: FALSIFY-RESP-003
  rule: Empty is not ok
  prediction: empty and whitespace answers fail as empty_completion with exit 8, through reconcile; a
    constraint refusal of the same run wins
  test: |
    response_contract_an_empty_completion_is_a_failure_that_names_why
    response_contract_an_empty_run_exits_non_zero_through_reconcile
    response_contract_a_constraint_refusal_wins_over_empty
  file: crates/apr-cli/src/commands/run_tests_response_contract.rs
  if_fails: an empty answer reads as success (the #3724 shape)
- id: FALSIFY-RESP-004
  rule: The document names what produced it
  prediction: model_digest is the sha256sum of the loaded file (abc hashes to ba7816bf...), null for a
    directory or a run with no result; apr_version and apr_git_sha are present on ok and error documents
  test: |
    response_contract_the_document_carries_the_model_digest_and_the_apr_build
    response_contract_the_model_digest_is_sha256sum_of_the_file_and_none_for_a_directory
  file: crates/apr-cli/src/commands/run_tests_response_contract.rs
  if_fails: a consumer cannot lock a generated asset to the model and build that produced it
- id: FALSIFY-RESP-005
  rule: apr serve names the model that answered
  prediction: /health, /v1/models, an unmatched route and a chat completion all carry x-apr-model-digest;
    the chat.completion body carries model_digest, apr_version, apr_git_sha; non-completion objects are
    untouched; no identity, no header; apr serve's identity is the sha256sum of the file it was given
  test: |
    every_response_carries_the_model_digest_header
    a_completion_body_names_what_produced_it
    only_a_completion_object_is_stamped
    the_served_identity_is_sha256sum_of_the_file_and_this_build
    identified_hands_the_router_the_served_identity
  file: crates/aprender-serve/src/api/tests/model_identity_3720.rs
  if_fails: a served answer cannot be traced to the model file or apr build that produced it
- id: FALSIFY-RESP-006
  rule: A run never silently differs
  prediction: a CPU run is deterministic and echoes the seed only when it sampled; a GPU run says
    gpu_not_guaranteed and an unreported backend says backend_unreported; the json document and the
    stream final event carry the promise
  test: |
    response_contract_determinism_case_table
    response_contract_the_document_carries_the_determinism_promise
  file: crates/apr-cli/src/commands/run_tests_response_contract.rs
  if_fails: two runs of the same model, prompt and seed differ and nothing told the consumer
- id: FALSIFY-RESP-007
  rule: A served completion never silently differs
  prediction: a CPU-resident server promises a repeat; a CUDA or wgpu one says gpu_not_guaranteed and one with
    no backend resident says backend_unreported; only completion bodies carry it
  test: |
    serve_determinism_case_table
    a_completion_body_names_what_produced_it
    only_a_completion_object_is_stamped
  file: crates/aprender-serve/src/api/tests/model_identity_3720.rs
  if_fails: two answers to the same request and seed differ and nothing told the client
