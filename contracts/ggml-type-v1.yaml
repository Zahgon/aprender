metadata:
  version: 1.18.0
  created: '2026-09-20'
  author: PAIML Engineering
  description: |
    ONE ggml tensor-type enum for the workspace, and ONE table of what each
    type weighs, both extracted from upstream ggml rather than written by hand.

    THE DEFECT THIS CLOSES (PMAT-3430, epic PP-QUANT-001 #3421). aprender named
    ggml tensor types in three independent enums -- aprender-serve's
    GgmlQuantType (16 ids), aprender-core's GgmlType (12), aprender-compute's
    GgmlType (15) -- plus a private 13-row label table, against 35 live ids
    upstream. Nothing compared any of them to upstream, so NVFP4 (40), Q1_0 (41)
    and Q2_0 (42) appeared upstream with no signal in this tree at all, and the
    byte-size tables disagreed with upstream AND with each other.

    THE ORACLE (operator ruling 2026-09-20, clauses 2' / 2a / 3). Upstream ggml
    at scripts/llama_pin.toml `build_commit`, BY REFERENCE and never as a
    literal sha, is the reference; in-tree values are the defendant. Every row
    of trueno_quant::TRAITS is extracted by scripts/extract_ggml_traits.sh from
    ggml's own compiled type_traits table into
    crates/aprender-quant/fixtures/ggml_traits.json, which records the sha it
    read. A pin bump therefore turns the fixture RED until it is regenerated in
    the bump's own PR.

    WHY THE EXTRACTOR COMPILES A PROBE. ggml's table gives
    `.type_size = sizeof(block_q4_1)` -- a C expression. Every in-tree table
    that got these numbers wrong got them wrong by hand, so the extractor links
    the pinned checkout's own libggml-base and calls ggml_type_size /
    ggml_blck_size / ggml_type_name.

    THE COMMENTED-ROW TRAP. `enum ggml_type` has 8 commented-out rows and only
    some say "removed" -- `// GGML_TYPE_Q4_0_4_8 = 32,` says nothing. A first
    pass that classified by comment WORDING returned 44/41/3 instead of
    43/35/8. Membership is positional, and the classification must agree with
    the compiled table or the extractor refuses to emit.
  references:
  - 'ggml/include/ggml.h enum ggml_type at the pinned comparator commit (GGML_TYPE_COUNT = 43)'
  - 'ggml/src/ggml.c type_traits[GGML_TYPE_COUNT] -- .blck_size / .type_size / .type_name'
  - 'scripts/llama_pin.toml build_commit -- the oracle, by reference'
  - 'scripts/extract_ggml_traits.sh + scripts/extract_ggml_traits.awk -- the committed extraction command'
  - 'crates/aprender-quant/fixtures/ggml_traits.json -- the checked-in fixture, recording its sha'
  - 'crates/aprender-quant/src/ggml_type.rs -- GgmlType, QuantTraits, TRAITS[43]'
  - 'GitHub #3418 (serve sizes from TRAITS, one table), #3430 (M1), #3431 (M2 reconciliation), #3421 (epic), #3563 (pin-derived artifacts, general case)'

name: ggml-type
version: 1.18.0
scope: aprender-quant (trueno_quant) ggml tensor-type enum and TRAITS table

description: |
  The workspace has exactly one ggml tensor-type id space, indexed by upstream
  id, whose per-type block geometry equals upstream's at the pinned comparator
  commit. A type's size is `type_size` bytes per `blck_size` elements; a removed
  id is not constructible but keeps its slot; and the fixture that supplies
  every number records the commit it was read from.

equations:
  block_geometry:
    description: 'TRAITS[i].{blck_size,type_size} equals ggml at the pinned commit'
    formula: |
      For every live id i:
        TRAITS[i].blck_size == ggml_blck_size(i)
        TRAITS[i].type_size == ggml_type_size(i)
        TRAITS[i].ggml_name == ggml_type_name(i)
      For every removed id i:
        TRAITS[i].blck_size == 0 AND TRAITS[i].type_size == 0
    domain: 'ggml tensor-type ids 0..=42 at build_commit d1d3c3396 (35 live, 8 removed)'
    codomain: 'elements per block (u32) and bytes per block (u32)'
    invariants:
    - 'TRAITS has exactly 43 rows, dense, indexed by id'
    - 'live + removed == 43; live == 35 and removed == 8 at the current pin'
    - 'every live row has blck_size > 0 and type_size > 0'
    - 'name and ggml_name differ in ASCII case only (Q4_K vs q4_K)'
    lean_theorem: Theorems.Ggml_Block_Geometry
  tensor_bytes:
    description: 'bytes for n elements, rounding a partial block up'
    formula: 'tensor_bytes(t, n) = ceil(n / blck_size(t)) * type_size(t)'
    domain: 'a live type and a non-negative element count'
    codomain: byte count (usize)
    invariants:
    - 'tensor_bytes(t, blck_size(t)) == type_size(t)'
    - 'tensor_bytes(t, 0) == 0'
    - 'checked_tensor_bytes refuses (None) when n is not a multiple of blck_size'
    lean_theorem: Theorems.Ggml_Tensor_Bytes

proof_obligations:
- id: GGMLT-INV-001
  type: invariant
  property: every TRAITS row equals the upstream fixture row for its id
  formal: |
    ∀ i ∈ 0..43:
      TRAITS[i].name       ≡ fixture.types[i].enum_name ∧
      TRAITS[i].ggml_name  ≡ fixture.types[i].ggml_name ∧
      TRAITS[i].blck_size  ≡ fixture.types[i].blck_size ∧
      TRAITS[i].type_size  ≡ fixture.types[i].type_size ∧
      (TRAITS[i].family ≡ Removed) ↔ (fixture.types[i].status ≠ "live")
- id: GGMLT-INV-002
  type: invariant
  property: the fixture was extracted at the pin of record
  formal: |
    fixture.pin_build_commit ≡ llama_pin.build_commit ∧
    prefix(fixture.resolved_sha, llama_pin.build_commit)
- id: GGMLT-INV-003
  type: invariant
  property: a removed id is distinguishable from an id that never existed
  formal: |
    ∀ r ∈ REMOVED_IDS:
      from_id(r) ≡ None ∧ try_from_id(r) ≡ Err(Removed{id: r, name: TRAITS[r].name})
    ∀ u ≥ 43: try_from_id(u) ≡ Err(Unknown{id: u})
- id: GGMLT-EQ-004
  type: equivalence
  property: the 16 strings and 15 sizes the replaced enums carried are unchanged
  formal: |
    ∀ (id, name) ∈ SERVE_16:
      as_str(from_id(id)) ≡ name ∧
      from_str_lossy(name) ≡ from_str_lossy(lower(name)) ≡ Some(from_id(id))
    ∀ (id, blck, bytes) ∈ COMPUTE_15:
      block_size(from_id(id)) ≡ blck ∧ block_bytes(from_id(id)) ≡ bytes
- id: GGMLT-INV-005
  type: invariant
  property: aprender's family column agrees with upstream's is_quantized flag
  formal: |
    ∀ i ∈ 0..43:
      (TRAITS[i].family ∉ {Float, Int, Removed}) ↔ fixture.types[i].is_quantized

- id: GGMLT-INV-006
  type: invariant
  property: aprender-serve sizes a tensor from TRAITS, never from a table of its own (#3418)
  formal: |
    ∀ i ∈ 0..43:
      serve::traits(i).is_some() ↔ TRAITS[i].blck_size > 0 ∧
      serve::traits(i) ≠ None → serve::traits(i).{name,blck_size,type_size}
                               ≡ TRAITS[i].{name,blck_size,type_size}
    ∀ u ≥ 43: serve::traits(u) ≡ None

falsification_tests:
- id: FT-GGMLT-001
  rule: mutating any one TRAITS row turns the fixture test RED
  prediction: |
    Setting TRAITS[9].type_size to 40 (gguf-py's value for Q8_1, which the C
    static_assert refutes) fails traits_table_equals_the_upstream_fixture_row_for_row
    AND computes_fifteen_sizes_are_unchanged. Renaming TRAITS[30].name from
    BF16 to Bf16 fails serves_sixteen_strings_still_mean_what_they_meant.
    Giving a removed row a live family fails two more.
  test: cargo test -p aprender-quant --test ggml_traits_fixture
  if_fails: 'a TRAITS row no longer matches the upstream-extracted fixture.'
  evidence: |
    Measured 2026-09-20, all four mutations RED and the unmutated control GREEN
    (8 tests): M1 TRAITS[9].type_size 36->40, M2 TRAITS[30].name BF16->Bf16,
    M3 TRAITS[4].family Removed->Affine, M4 a fake id 43 added to the fixture.
- id: FT-GGMLT-002
  rule: a comparator pin bump turns the fixture RED until it is regenerated
  prediction: |
    Rewriting the fixture's pin_build_commit to the superseded comparator
    39173bcac fails falsify_ggml_001_traits_fixture_records_the_current_pin
    with a message naming both shas and the regeneration command.
  test: cargo test -p aprender-core --test monorepo_invariants falsify_ggml
  if_fails: 'the fixture and scripts/llama_pin.toml name different commits.'
  evidence: 'Measured 2026-09-20: RED on the mutation, GREEN on the control (3 tests).'
- id: FT-GGMLT-003
  rule: the extractor refuses a live/Removed classification that disagrees with ggml
  prediction: |
    On synthetic inputs, the emitter exits 7 when the header revives a row the
    compiled table calls dead, when it buries a live one, when GGML_TYPE_COUNT
    disagrees, and when a live id has type_size 0 -- and exits 0, classifying a
    wording-free commented row as Removed, on the control.
  test: bash scripts/extract_ggml_traits_selftest.sh
  if_fails: 'the extractor would emit a fixture that is confidently wrong on the commented rows.'
  evidence: |
    7 cases, 0 failures, measured 2026-09-20. Also run in CI from
    falsify_ggml_003_extractor_case_table_passes, which refuses a vacuous
    (zero-case) run.
- id: FT-GGMLT-004
  rule: the crate's six legacy K-quant constants may not drift from TRAITS
  prediction: |
    Q4_K_BLOCK_BYTES != TRAITS[12].type_size is a COMPILE error (a const
    assertion in lib.rs), not a test failure.
  test: cargo build -p aprender-quant
  if_fails: 'a published constant and the upstream table disagree about the same number.'
  evidence: cargo build -p aprender-quant

- id: FT-GGMLT-005
  rule: the family column cannot claim a quantization upstream does not report
  prediction: |
    Giving a Float/Int id a quantized family, or a quantized id the Float
    family, fails the_family_classification_agrees_with_upstreams_is_quantized_flag
    with the id, the family and both flags in the message.
  test: cargo test -p aprender-quant --test ggml_traits_fixture
  if_fails: 'aprender''s family classification and ggml''s is_quantized disagree.'
  evidence: |
    Measured 2026-09-20 by mutation M3 (TRAITS[4].family Removed -> Affine),
    which this test catches independently of the row-for-row comparison.

- id: FT-GGMLT-006
  rule: aprender-serve's sizing table cannot drift from TRAITS (#3418, one table)
  prediction: |
    serve_table_matches_trueno_quant_traits walks every TRAITS id and lists each
    row where serve's traits(id) differs in name, blck_size or type_size, sizes
    an id TRAITS calls removed, or leaves unsized an id TRAITS sizes. Once serve
    reads TRAITS it is GREEN; restoring a hand-written serve row (e.g. Q8_1
    type_size 40) turns it RED with the id in the message.
  test: cargo test -p aprender-serve --lib serve_table_matches_trueno_quant_traits
  if_fails: 'aprender-serve sizes a ggml type differently from the upstream-extracted TRAITS table.'
  evidence: |
    Measured 2026-10-12 on origin/main 8c12fca86d, before the derivation: RED,
    4 rows differ -- 39 MXFP4 (serve names it, sizes nothing), 40 NVFP4,
    41 Q1_0, 42 Q2_0 (serve has no row); ids 0..38 equal.

- id: FT-GGMLT-007
  rule: the GGUF->APR Q4_K converter sizes the tensors it reads from serve's TRAITS-derived table (#3418)
  prediction: |
    converter_sizes_from_the_one_ggml_table_3418 calls ggml_tensor_byte_size_h for
    ids 0..64 and element counts {1,31,32,33,255,256,257,4096}. It is GREEN when the
    13 types the converter reads size as div_ceil(n, blck_size) * type_size from
    gguf::ggml_type_table::traits and every other id is refused. Reading a field of
    the wrong row, or admitting a type the converter does not read, turns it RED.
  test: cargo test -p aprender-serve --lib converter_sizes_from_the_one_ggml_table_3418
  if_fails: 'the GGUF->APR converter sizes or admits a ggml type differently from the one table.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 f53e433c7, before the derivation: GREEN. The
    13 hand-written arms already equalled the table; the derivation deletes them
    and this test keeps them from returning.

- id: FT-GGMLT-008
  rule: the CUDA path's WeightQuantType sizes every type it admits from TRAITS (#3418)
  prediction: |
    cuda_weight_types_size_from_the_one_ggml_table_3418 (aprender-serve, feature
    cuda) walks ids 0..64; for every id from_ggml_type admits it checks
    bytes_per_superblock == type_size*256/blck_size, bytes_per_block ==
    type_size*32/blck_size (truncated), matches_size on a 3x512 tensor, and that
    from_size resolves those bytes to a type of the same size. GREEN once the
    sizes are read from TRAITS through one exhaustive ggml_id(); a wrong id or a
    hand-written size turns it RED with the id in the message.
  test: cargo test -p aprender-serve --features cuda --lib cuda_weight_types_size_from_the_one_ggml_table_3418
  if_fails: 'the CUDA path sizes a ggml type differently from the upstream-extracted TRAITS table.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 bb618dc2e, before the derivation: GREEN.
    The 18 hand-written rows in bytes_per_superblock, bytes_per_block,
    from_ggml_type and from_size already equalled TRAITS; the derivation deletes
    them.

- id: FT-GGMLT-009
  rule: the GGUF scale scanner sizes every block it admits from TRAITS (#3418)
  prediction: |
    scale_scanner_sizes_from_the_one_ggml_table_3418 (aprender-serve lib) walks
    ids 0..64; quant_block_layout admits exactly Q4_0, Q4_1, Q5_0, Q5_1, Q8_0,
    Q2_K, Q3_K, Q4_K, Q5_K and Q6_K, every admitted block size equals that
    type's type_size in the one ggml table, and every f16 scale offset lies
    inside its block. GREEN once the block size is read from the table and only
    the scale offsets stay local; a hand-written size or an admitted extra type
    turns it RED with the id in the message.
  test: cargo test -p aprender-serve --lib scale_scanner_sizes_from_the_one_ggml_table_3418
  if_fails: 'the NaN/Inf scale scanner reads blocks of a size the upstream-extracted TRAITS table does not give.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 e307f52ce, before the derivation: GREEN.
    The ten hand-written block sizes in gguf/embedding.rs quant_block_layout
    already equalled TRAITS; the derivation deletes them.

- id: FT-GGMLT-010
  rule: the CUDA layer graph carries every weight type through its ggml id and back (#3418)
  prediction: |
    graph_carries_every_weight_type_through_its_ggml_id_3418 (aprender-serve,
    feature cuda) walks WeightQuantType::ALL; for each type the code
    graph_builder writes on the node equals ggml_id(), and graph_dispatch maps
    that code back to the same type. GREEN once both directions read the one
    exhaustive ggml_id(); a type that either side turns into Q4_K (and so
    dequantizes with the Q4_K kernel, the PERF-050 failure) turns it RED with
    the type in the message.
  test: cargo test -p aprender-serve --features cuda --lib graph_carries_every_weight_type_through_its_ggml_id_3418
  if_fails: 'a weight on the CUDA graph path is dispatched to a kernel for a different ggml type.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 70acee883, before the derivation: RED.
    11 of the 18 types (F32, F16, BF16, Q2_K, Q5_1 and six IQ types) were
    carried as 12 and read back as Q4_K. GREEN after.

- id: FT-GGMLT-011
  rule: the APR loader decodes Q5_K as Q5_K and never hands it to a Q4_K kernel (#3418)
  prediction: |
    apr_q5k_is_never_read_as_q4k_3418 (aprender-serve lib) builds Q5_K
    super-blocks (176 bytes each) and checks that dequant_by_dtype(.., 13)
    equals crate::quantize::dequantize_q5_k, both for a 1-D tensor and for a
    2-D tensor whose rows are padded to 256 (GH-202). It also checks that
    AprTensorLookup::get_q4k returns the bytes of a Q4_K (12) tensor and
    refuses a Q5_K (13) one, so the forward falls back to the f32 weights
    instead of the Q4_K fused kernel. GREEN once 13 has its own arm; routing
    13 through the Q4_K dequant or admitting it in get_q4k turns it RED.
  test: cargo test -p aprender-serve --lib apr_q5k_is_never_read_as_q4k_3418
  if_fails: 'an APR Q5_K tensor is decoded or multiplied with the 144-byte Q4_K super-block layout.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 15c70af23, before the change: RED on
    the 1-D check (the Q4_K arm drops the fifth bit: 315.5 where Q5_K reads
    811.5). GREEN after; each of the two arms, reverted alone, turns it RED.
- id: FT-GGMLT-012
  rule: every quantized dtype byte the APR writer emits reaches its own decoder in the APR loader (#3418)
  prediction: |
    every_byte_the_apr_writer_emits_reaches_its_own_decoder_3418
    (aprender-serve lib) checks that dequant_by_dtype decodes 128 as AprQ4
    (dequantize_apr_q4_native), 129 as AprQ8 (dequantize_apr_q8_native),
    10 as Q2_K and 11 as Q3_K (crate::quantize::dequantize_q2_k /
    dequantize_q3_k), with the Q2_K and Q3_K super-blocks sized from the one
    ggml table. GREEN once each byte has its own arm; removing any of the
    four arms sends that byte to the F32 arm and turns it RED.
  test: cargo test -p aprender-serve --lib every_byte_the_apr_writer_emits_reaches_its_own_decoder_3418
  if_fails: 'an APR tensor written as AprQ4, AprQ8, Q2_K or Q3_K is read as raw little-endian F32 bytes.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 b8e2f67d3, before the change: RED on
    the first check (a 64-value AprQ4 tensor came back as 9 F32 values).
    GREEN after; each of the four arms, removed alone, turns it RED.
- id: FT-GGMLT-013
  rule: the APR loader refuses a block-quantized tensor whose byte size does not fit its dims under the one ggml table, instead of zero-filling it (#3418)
  prediction: |
    apr_load_refuses_a_tensor_whose_bytes_do_not_fit_its_dims_3418
    (aprender-serve lib) builds a minimal APR v2 file whose gate_proj is Q4_0
    (ggml 2). With the whole 18-byte-per-32 payload AprTransformer::from_apr_bytes
    is Ok; with one byte cut it is Err. The accepted sizes come from the
    table (blck_size, type_size): ceil(n / blck) * type_size, or for a 2-D
    tensor rows * ceil(cols / blck) * type_size (rows padded, GH-202). Ids 8
    and 9 are skipped (legacy APR Q4/Q8, GH-438). GREEN once the loader
    checks; removing the check turns it RED.
  test: cargo test -p aprender-serve --lib apr_load_refuses_a_tensor_whose_bytes_do_not_fit_its_dims_3418
  if_fails: 'a short or oversized quantized APR tensor loads, and the decoder zero-fills the weights it cannot read.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 dab237dac, before the change: RED on
    the short check (the one-byte-short Q4_0 tensor loaded; the whole one
    loaded too, as it should). GREEN after; removing the check turns it RED.
    Two existing Q5_K fixtures (tests_10 make_hf_tensors) were built from the
    144-byte Q4_K layout; the check refused them and they now use 176 bytes.
- id: FT-GGMLT-014
  rule: the APR loader decodes IQ tensors with the IQ decoders and refuses a block-quantized id it has no decoder for; no block type is read as F32 (#3418)
  prediction: |
    iq_tensors_reach_the_iq_decoders_3418 checks that dequant_by_dtype on a
    whole IQ tensor equals crate::quantize::dequantize_iq_tensor for every id
    iq_dispatch::iq_block_elems admits. apr_load_refuses_a_block_type_it_cannot_decode_3418
    builds a minimal APR v2 file with a whole Q8_K (ggml 15) gate_proj and
    expects from_apr_bytes to be Err. every_admitted_block_id_has_a_decoder_arm_3418
    ties the loader's list of decoded ids to the match: each block id the
    list admits decodes to something other than the F32 reading of its
    bytes. GREEN once IQ ids have an arm and undecoded ids are refused;
    removing the IQ arm, or the refusal, turns it RED.
  test: cargo test -p aprender-serve --lib _3418
  if_fails: 'an APR tensor of a block type the loader cannot decode is read as raw little-endian F32 bytes.'
  evidence: |
    Measured 2026-10-12 on la-74/3418 58c3accd5, before the change: RED on
    both (IQ id 16 was not decoded by the IQ decoder; a whole Q8_K tensor
    loaded).
    After: GREEN, 3 of 3 _3418 tests in this row; apr_transformer:: 752 passed;
    aprender-serve --lib (--skip qwen35) 16201 passed, 0 failed; clippy
    --lib --tests -D warnings rc 0. Mutants: the IQ arm guard forced false
    turns iq_tensors_reach_the_iq_decoders_3418 and
    every_admitted_block_id_has_a_decoder_arm_3418 RED; the refusal forced
    off turns apr_load_refuses_a_block_type_it_cannot_decode_3418 RED.
- id: FT-GGMLT-015
  rule: the APR loader reads dtype bytes 3, 6 and 7 as apr-format defines them (TensorDType::from_u8 F64, I8, U8), not as ggml Q4_1, Q5_0, Q5_1; F64 decodes to f32 and an I8 or U8 tensor is refused at load (#3418, quorum handoff/quorum-la074-a1-ids367.md 2/2 a)
  prediction: |
    apr_ids_3_6_7_follow_apr_format_3418 checks that dequant_by_dtype on the
    little-endian F64 bytes of [1.5, -2.0, 0.25] with dtype 3 returns those
    three values. apr_load_refuses_an_i8_or_u8_tensor_3418 builds a minimal
    APR v2 file with an extra U8 tensor (model.layers.0.extra_ints) of 24 bytes, exactly
    one Q5_1 block and so passed the step-10 size check, and expects
    from_apr_bytes to be Err; the same for an I8 tensor of 22 bytes (one Q5_0
    block), and that the refusal names I8/U8. GREEN once 3 decodes as F64
    and 6/7 are refused as I8/U8; reading 3 as
    Q4_1 again, or dropping the refusal, turns it RED.
  test: cargo test -p aprender-serve --lib _3418
  if_fails: 'an APR F64, I8 or U8 tensor is decoded as ggml Q4_1, Q5_0 or Q5_1 block data.'
  evidence: |
    Quorum 2026-10-12 (sonnet+haiku, planted fact caught by both): 2/2 a.
    Measured 2026-10-12/13 on intel (no GPU, no ptxas), la-74/3418 on
    7a736088b. Before, `--features cuda _3418`: 18 passed, 4 RED (wgpu
    refused Q4_0 (2); the embedding refused Q3_K (11); the CUDA helper
    refused Q5_1 (7); dequantize_weight decoded IQ4_NL (20) as 256-value
    blocks). After: 23 passed (with the padded-row test). Mutants, each
    RED then restored by cmp: Q5_1 row wired to dequantize_q5_0 (table and
    site tests RED); CUDA helper's to_float arm dropped (its site test
    RED); dequantize_weight decoding padded rows flat (padded-row test RED
    at Q4_0). Full lib default: 16211 passed. Full lib --features cuda:
    17955 passed, 8 RED, all cuda::/PTX tests that need the NVIDIA driver
    or ptxas (absent on intel). clippy --lib --tests -D warnings default
    and cuda: clean; fmt --check: clean. Q4_K on dequantize_weight's
    per-call path keeps its AVX2 kernel (agrees with the column to 1e-4).
    Before, on 22dba9bb2: RED, dtype 3 F64 bytes came back as Q4_1 values and
    a 24-byte U8 tensor loaded. After: GREEN; apr_transformer:: 754 passed;
    aprender-serve --lib (--skip qwen35) 16203 passed, 0 failed; clippy rc 0.
    Mutants: 3 read as Q4_1 again turns apr_ids_3_6_7_follow_apr_format_3418
    RED. The I8/U8 refusal removed first SURVIVED, because the step-11
    no-decoder check still refused id 7 as Q5_1; the test now requires the
    refusal to name I8/U8, and that mutant is RED (refused for the wrong
    reason: no decoder for Q5_1).

- id: FT-GGMLT-016
  rule: AprQuantizationType (serve QuantizedAprTransformer) reads bytes_per_block, values_per_block and bits_per_weight from the one ggml table through its ggml id (F32 0, Q4_K 12, Q8_0 8); Q8_0 is 34 bytes and 8.5 bits per 32 values, not the hand-written 36 and 8.0 (#3418, quorum handoff/quorum-la074-a1-aprq8size.md 2/2 a)
  prediction: |
