metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  references:
    - "LZ4 Frame format specification"
    - "Zstd compression format"
  description: |
    Compression codec roundtrip contract. APR format supports LZ4 and Zstd
    compression for tensor data. Compress→decompress must be lossless.

name: compression-roundtrip
version: "1.0.0"
scope: "crates/aprender-core/src/format/ — APR tensor compression"

description: |
  APR format stores tensor data with optional LZ4 or Zstd compression.
  This contract ensures lossless roundtrip: decompress(compress(data)) == data.

equations:
  lossless_roundtrip:
    description: "Compression roundtrip is bit-exact"
    formula: "∀ data, codec ∈ {lz4, zstd}: decompress(compress(data, codec), codec) == data"
    note: "Byte-level equality, not floating-point tolerance"

  size_reduction:
    description: "Compressed size ≤ original size (or minimal overhead for incompressible data)"
    formula: "∀ data, codec: compressed_size(data, codec) ≤ len(data) + overhead(codec)"
    note: "LZ4 overhead ~16 bytes, Zstd ~18 bytes for incompressible data"

falsification_tests:
  - id: FALSIFY-COMP-001
    description: "LZ4 roundtrip is lossless"
    test: "cargo test -p aprender-core --lib --features format-compression test_lz4_compression_roundtrip"
    prediction: "decompress_payload(compress_payload(data, Lz4)) == data for a 1000-byte buffer, and the compressed payload is smaller than the input"
    evidence: "cargo test -p aprender-core --lib compression"

  - id: FALSIFY-COMP-002
    description: "Zstd roundtrip is lossless"
    test: "cargo test -p aprender-core --lib --features format-compression test_zstd_compression_roundtrip"
    prediction: "a 10,000-float model saved with Zstd loads back equal to the original"
    evidence: "cargo test -p aprender-core --lib compression"
