metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 3: The APR Model Format
  contract: apr-book-ch03
  status: enforced
  title: "The APR Model Format"
  part: I
  example: ch03_apr_format
  arxiv_citations: []

api_calls:
  - module: "aprender::format::validated_tensors"
    functions: ["TensorStats::compute"]
    min_calls: 1
preconditions:
  - "cargo build -p aprender-core --example ch03_apr_format succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "TensorStats computed on real float data"
  - "Layout contract (row-major) demonstrated with assertions"
  - "Magic bytes and format version validated"
falsification:
  - condition: "cargo run -p aprender-core --example ch03_apr_format exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "No TensorStats::compute called on real data"
    severity: P0
    action: add_tensor_stats
  - condition: "Layout contract not exercised with assertion"
    severity: P0
    action: add_layout_assertion
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH03-001
    rule: "The chapter example runs to completion and every assert! in it holds"
    prediction: "cargo run -p aprender-core --example ch03_apr_format exits 0; any failing assert! panics and the run exits non-zero"
    test: "cargo run -p aprender-core --example ch03_apr_format"
    if_fails: "The chapter's code no longer runs as printed, or one of the results it asserts is wrong"
  - id: FALSIFY-BOOK-CH03-002
    rule: "The chapter example imports no pre-monorepo crate name"
    prediction: "namespace_discipline_in_examples passes: ch03_apr_format.rs has no 'use <legacy>::', '<legacy> =' or 'cargo install <legacy>' for trueno, realizar, entrenar, batuta, presentar or renacer. It scans the example source, not the chapter prose"
    test: "cargo test -p aprender-core --test book_contracts namespace_discipline_in_examples"
    if_fails: "The chapter example teaches a crate name that no longer exists as a published dependency"
